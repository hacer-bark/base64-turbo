[package]
name = "base64-turbo"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "A Base64 engine that peaks past 100 GiB/s, formally verified (Kani/MIRI/MSan). Runtime AVX2/AVX512-VBMI detection, NEON acceleration, zero-allocation API, no_std support."
license = "MIT OR Apache-2.0"
repository = "https://github.com/hacer-bark/base64-turbo"
documentation = "https://docs.rs/base64-turbo"
readme = "README.md"
authors = ["Hacer"]
keywords = ["base64", "simd", "avx512-vbmi", "neon", "encoding"]
categories = ["encoding", "hardware-support", "no-std", "web-programming"]
exclude = ["benches/scripts/", "benches/results/"]

[features]
default = ["std", "simd", "neon"]

# Core
std = []
unstable = []

# x86/x86_64 SIMD kernels.
avx2 = ["std"]
avx512-vbmi = ["std"]

# Convenience meta-feature: every x86 SIMD kernel at once.
simd = ["avx2", "avx512-vbmi"]

# aarch64 NEON kernel (compile-time dispatch, no runtime detection, no std).
neon = []

[dev-dependencies]
rand = "0.10"
criterion = { version = "0.8", features = ["html_reports"] }
base64 = "0.23"
base64-simd = "0.8"
base64-ng = { version = "2", features = ["simd"] }

[lints.rust]
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
redundant_pub_crate = "allow"

[[bench]]
name = "encoding_bench"
harness = false
