[package]
name = "base64-turbo"
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
authors = ["Hacer-Bark <hacer.bark@proton.me>"]
license = "0BSD"
description = "A Base64 engine that peaks past 100 GiB/s, formally verified (Kani/MIRI/MSan)."
repository = "https://github.com/hacer-bark/base64-turbo"
documentation = "https://docs.rs/base64-turbo"
keywords = ["base64", "simd", "avx512-vbmi", "neon", "encoding"]
categories = ["encoding", "hardware-support", "no-std", "web-programming"]
exclude = ["benches/scripts/", "benches/results/", "benches/tb64-sys/"]

# `benches/tb64-sys` is a dev-only member so it shares this target dir and lock file.
# `fuzz` stays outside, as cargo-fuzz expects.
[workspace]
members = ["benches/tb64-sys"]
exclude = ["fuzz"]

[features]
default = ["std", "simd", "neon"]

# Core
std = []
unstable = []

# x86/x86_64 SIMD kernels.
avx2 = ["std"]
avx512-vbmi = ["std"]

# Convenience meta-feature: every x86 SIMD kernel at once.
simd = ["avx2", "avx512-vbmi"]

# aarch64 NEON kernel (compile-time dispatch, no runtime detection, no std).
neon = []

[dev-dependencies]
rand = "0.10"
criterion = { version = "0.8", features = ["html_reports"] }
base64 = "0.23"
base64-simd = "0.8"
base64-ng = { version = "2", features = ["simd"] }
# Turbo-Base64 (C) competitor. Compiles to stubs unless a checkout is present;
# see benches/tb64-sys/README.md.
tb64-sys = { path = "benches/tb64-sys" }

[lints.rust]
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
exit = "deny"
redundant_pub_crate = "allow"

[lints.rustdoc]
all = { level = "deny", priority = -1 }
broken_intra_doc_links = "deny"

[[bench]]
name = "encoding_bench"
harness = false
