name: Logic & Security Tests

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: "test (${{ matrix.name }})"
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no_std
            flags: --no-default-features
          - name: std only
            flags: --no-default-features --features std
          - name: all features (x86_64)
            flags: --all-features
          - name: all features (aarch64)
            os: ubuntu-24.04-arm
            flags: --all-features
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.name }}
      - name: test
        run: cargo test --locked ${{ matrix.flags }}

  msan:
    name: "MSan (${{ matrix.target }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: std,simd,unstable
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            features: std,neon,unstable
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-msan
          key: ${{ matrix.target }}

      # silent green checkmark.
      - name: Report detected CPU SIMD tier
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          HAS_AVX2=0
          HAS_AVX512VBMI=0
          grep -qw avx2 /proc/cpuinfo && HAS_AVX2=1
          if grep -qw avx512f /proc/cpuinfo && grep -qw avx512bw /proc/cpuinfo && grep -qw avx512vbmi /proc/cpuinfo; then
            HAS_AVX512VBMI=1
          fi

          if [ "$HAS_AVX512VBMI" = "1" ]; then
            echo "SIMD tier under MSan this run: AVX512-VBMI"
          elif [ "$HAS_AVX2" = "1" ]; then
            echo "SIMD tier under MSan this run: AVX2"
            echo "::warning::Runner lacks AVX512-VBMI; encode_slice_avx512_vbmi/decode_slice_avx512_vbmi get zero MSan coverage this run. Still covered by the Kani proofs and the dedicated Miri AVX512-VBMI leg."
          else
            echo "SIMD tier under MSan this run: Scalar fallback"
            echo "::warning::Runner lacks AVX2 and AVX512-VBMI; only the scalar path gets MSan coverage this run. The SIMD paths are still covered by the Kani proofs and the dedicated Miri legs."
          fi

      - name: test (build-std, MemorySanitizer)
        env:
          RUSTFLAGS: -Z sanitizer=memory
        run: |
          cargo test --locked -Z build-std \
            --target ${{ matrix.target }} \
            --no-default-features --features "${{ matrix.features }}" \
            --lib --tests
