name: Security Audit

on:
  push:
    branches: [ "main" ]
    tags-ignore:
      - '**'
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  MIRIFLAGS: "-Zmiri-symbolic-alignment-check"

jobs:
  miri-check:
    name: MIRI Safety Checks (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Nightly with MIRI
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Run MIRI
        env:
          RUSTFLAGS: "-C target-feature=+avx2,+avx512f,+avx512bw,+avx512vbmi"
        run: |
          echo "Running MIRI with AVX2 + AVX512 + AVX512-VBMI all enabled..."
          cargo miri test --features unstable --lib --bins --tests --examples

  miri-check-aarch64:
    name: MIRI Safety Checks (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Nightly with MIRI
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Run MIRI
        env:
          RUSTFLAGS: "-C target-feature=+neon"
        run: |
          echo "Running MIRI with NEON enabled..."
          cargo miri test --features unstable --lib --bins --tests --examples
