name: Formal Verification

on:
  push:
    branches: [ "main" ]
    tags-ignore: ["**"]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  kani-index-proofs-avx2:
    name: Kani Model Checker (AVX2 Index / Induction)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1
        with:
          args: '--jobs 2 --output-format=terse --harness check_enc_rounds_model --harness check_enc_first_block --harness check_enc_wide_step --harness check_enc_single_step --harness check_enc_tail_handoff --harness check_dec_wide_step --harness check_dec_single_step --harness check_dec_tail_handoff'

      - name: Cleanup Artifacts
        if: always()
        run: cargo clean

  kani-index-proofs-avx512-vbmi:
    name: Kani Model Checker (AVX512-VBMI Index / Induction)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1
        with:
          args: '--jobs 2 --output-format=terse --harness check_vbmi_enc_quad_step --harness check_vbmi_enc_single_step --harness check_vbmi_enc_masked_step --harness check_vbmi_enc_masked_terminates --harness check_vbmi_enc_tail_handoff --harness check_vbmi_enc_stream_peel --harness check_vbmi_enc_stream_step --harness check_vbmi_dec_quad_step --harness check_vbmi_dec_single_step --harness check_vbmi_dec_masked_step --harness check_vbmi_dec_tail_slack --harness check_vbmi_dec_stream_peel --harness check_vbmi_dec_stream_step'

      - name: Cleanup Artifacts
        if: always()
        run: cargo clean

  kani-kernel-proofs-avx2:
    name: Kani Model Checker (AVX2 Kernels)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        harness:
          - check_avx2_encode_matches_ref_standard
          - check_avx2_encode_matches_ref_url_safe
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1
        with:
          args: '--jobs 1 --output-format=terse --unstable stubbing --harness ${{ matrix.harness }}'

      - name: Cleanup Artifacts
        if: always()
        run: cargo clean

  kani-kernel-proofs-avx512-vbmi:
    name: Kani Model Checker (AVX512-VBMI Kernels)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        harness:
          - check_vbmi_encode_matches_ref_standard
          - check_vbmi_encode_matches_ref_url_safe
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1
        with:
          args: '--jobs 1 --output-format=terse --unstable stubbing --harness ${{ matrix.harness }}'

      - name: Cleanup Artifacts
        if: always()
        run: cargo clean
