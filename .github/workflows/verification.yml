name: Formal Verification

on:
  push:
    branches: [ "main" ]
    tags-ignore:
      - '**'
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  kani-index-proofs:
    name: Kani Model Checker (Index / Induction)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1
        with:
          args: '--jobs 2 --output-format=terse --harness check_enc_rounds_model --harness check_enc_first_block --harness check_enc_quad_step --harness check_enc_single_step --harness check_enc_tail_handoff --harness check_dec_quad_step --harness check_dec_single_step --harness check_dec_tail_handoff'

      - name: Cleanup Artifacts
        if: always()
        run: cargo clean

  kani-kernel-proofs:
    name: Kani Model Checker (Kernels)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        harness:
          - check_avx2_roundtrip_standard
          - check_avx2_roundtrip_url_safe
          - check_avx2_decode_robustness
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1
        with:
          args: '--jobs 1 --output-format=terse --unstable stubbing --harness ${{ matrix.harness }}'

      - name: Cleanup Artifacts
        if: always()
        run: cargo clean
