name: Formal Verification

on:
  push:
    branches: [ "main" ]
    tags-ignore: ["**"]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    outputs:
      avx2: ${{ steps.filter.outputs.avx2 }}
      avx512-vbmi: ${{ steps.filter.outputs.avx512-vbmi }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common: &common
              - 'src/lib.rs'
              - 'src/scalar.rs'
              - 'src/simd/mod.rs'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/verification.yml'
            avx2:
              - *common
              - 'src/simd/avx2/**'
            avx512-vbmi:
              - *common
              - 'src/simd/avx512_vbmi/**'

  kani-index-proofs-avx2:
    name: Kani Model Checker (AVX2 Index / Induction)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.avx2 == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1
        with:
          args: '--jobs 2 --output-format=terse --harness check_enc_rounds_model --harness check_enc_first_block --harness check_enc_wide_step --harness check_enc_single_step --harness check_enc_tail_handoff --harness check_dec_wide_step --harness check_dec_single_step --harness check_dec_tail_handoff'

      - name: Cleanup Artifacts
        if: always()
        run: cargo clean

  kani-index-proofs-avx512-vbmi:
    name: Kani Model Checker (AVX512-VBMI Index / Induction)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.avx512-vbmi == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1
        with:
          args: '--jobs 2 --output-format=terse --harness check_vbmi_enc_quad_step --harness check_vbmi_enc_single_step --harness check_vbmi_enc_masked_step --harness check_vbmi_enc_masked_terminates --harness check_vbmi_enc_tail_handoff --harness check_vbmi_dec_quad_step --harness check_vbmi_dec_single_step --harness check_vbmi_dec_masked_step --harness check_vbmi_dec_tail_slack'

      - name: Cleanup Artifacts
        if: always()
        run: cargo clean

  kani-kernel-proofs-avx2:
    name: Kani Model Checker (AVX2 Kernels)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.avx2 == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        harness:
          - check_avx2_roundtrip_standard
          - check_avx2_roundtrip_url_safe
          - check_avx2_decode_matches_scalar
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1
        with:
          args: '--jobs 1 --output-format=terse --unstable stubbing --harness ${{ matrix.harness }}'

      - name: Cleanup Artifacts
        if: always()
        run: cargo clean

  kani-kernel-proofs-avx512-vbmi:
    name: Kani Model Checker (AVX512-VBMI Kernels)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.avx512-vbmi == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        harness:
          - check_vbmi_encode_matches_scalar_standard
          - check_vbmi_encode_matches_scalar_url_safe
          - check_vbmi_decode_matches_scalar
          - check_vbmi_decode_matches_scalar_masked
          - check_vbmi_roundtrip_standard
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Kani
        uses: model-checking/kani-github-action@v1.1
        with:
          args: '--jobs 1 --output-format=terse --unstable stubbing --harness ${{ matrix.harness }}'

      - name: Cleanup Artifacts
        if: always()
        run: cargo clean
