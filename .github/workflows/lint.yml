name: Lint

on:
  push:
    branches: [ "main" ]
    tags-ignore: ["**"]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: "clippy (${{ matrix.name }})"
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no_std
            flags: --no-default-features --lib --tests
          - name: std only
            flags: --no-default-features --features std --lib --tests
          - name: all features (x86_64)
            flags: --all-targets --all-features
          - name: all features (aarch64, exercises neon.rs)
            os: ubuntu-24.04-arm
            flags: --all-targets --all-features
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-clippy
          key: ${{ matrix.name }}
      - name: clippy
        run: cargo clippy --locked ${{ matrix.flags }}

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt
        run: cargo fmt --all --check
